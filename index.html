<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Collaboration Hub Sign-In</title>
<style>
  :root{
    /* UPBI palette, matching the dashboard and Hub Tracker exactly. The Notre
       Dame navy + gold were retired everywhere else; teal is the accent. */
    --nd-navy:#071d33; --navy-2:#0b2b4a;
    --accent:#0d9488; --accent-2:#0f766e; --accent-bg:#ccfbf1;
    --ink:#0f172a; --muted:#475569;
    --line:#e2e8f0; --line-2:#cbd5e1; --bg:#f0f4f8; --card:#fff;
    --ok:#059669; --err:#dc2626; --err-bg:#fee2e2;
    --focus:#0d9488; --radius:14px; --tap:52px;
    --shadow:0 1px 3px rgba(15,23,42,.06),0 6px 16px rgba(15,23,42,.05);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:34rem;margin:0 auto;padding:0 1rem 3rem}
  .brand{background:linear-gradient(160deg,var(--nd-navy),var(--navy-2));
    margin:0 -1rem 1.25rem;padding:1.5rem 1rem 1.6rem;border-bottom:3px solid var(--accent)}
  .brand-in{max-width:34rem;margin:0 auto;display:flex;flex-direction:column;gap:1.15rem}
  /* Corner mark: identifies the owner, it is not the headline. The logo artwork
     is dark on transparent -- built for white surfaces -- so it sits on a white
     chip rather than directly on the navy, where it went muddy. Height is fixed
     and width follows the 247x135 aspect; both are set so nothing can stretch. */
  .logo-chip{align-self:flex-end;background:#fff;border-radius:10px;padding:.45rem .6rem;
    line-height:0;box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .logo-chip img{height:34px;width:62px;display:block}
  header{padding:0}
  h1{font-size:1.5rem;line-height:1.2;margin:0 0 .3rem;color:#fff;letter-spacing:-.02em;text-wrap:balance}
  .sub{color:#cbd5e1;font-size:.95rem;margin:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:1.15rem;margin-bottom:1rem;box-shadow:var(--shadow)}
  label{display:block;font-weight:600;margin:0 0 .35rem;font-size:.98rem}
  .hint{font-weight:400;color:var(--muted);font-size:.85rem;display:block;margin-top:.15rem}
  input,select,textarea{
    width:100%;min-height:var(--tap);padding:.7rem .8rem;font-size:1rem;font-family:inherit;
    border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
  }
  textarea{min-height:5.5rem;resize:vertical}
  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,[tabindex]:focus-visible{
    outline:3px solid var(--focus);outline-offset:2px
  }
  .field{margin-bottom:1rem}
  .field:last-child{margin-bottom:0}
  button{
    min-height:var(--tap);font-size:1rem;font-family:inherit;font-weight:600;
    border-radius:10px;border:1px solid transparent;cursor:pointer;padding:.7rem 1rem;
  }
  .primary{background:var(--accent);color:#fff;width:100%;box-shadow:0 1px 2px rgba(15,23,42,.10)}
  .primary:hover{background:var(--accent-2)}
  .primary[disabled]{background:#94a3b8;cursor:not-allowed;box-shadow:none}
  .secondary{background:#fff;color:var(--nd-navy);border-color:var(--line-2);width:100%}
  .secondary:hover{border-color:var(--accent);color:var(--accent-2)}
  .results{list-style:none;margin:.6rem 0 0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .results li+li{border-top:1px solid var(--line)}
  .results button{
    width:100%;text-align:left;background:#fff;border:0;border-radius:0;padding:.8rem;font-weight:600;
  }
  .results button:hover{background:var(--accent-bg)}
  .results .biz{display:block;font-weight:400;color:var(--muted);font-size:.9rem;margin-top:.1rem}
  .chosen{display:flex;gap:.75rem;align-items:flex-start;background:var(--accent-bg);
    border:1px solid #5eead4;border-radius:10px;padding:.8rem}
  .chosen strong{display:block}
  .chosen .biz{color:var(--muted);font-size:.9rem}
  .chosen button{background:none;border:0;color:var(--focus);text-decoration:underline;padding:.25rem;min-height:auto;font-size:.9rem}
  .msg{border-radius:10px;padding:.8rem;margin:0 0 1rem;font-size:.95rem}
  .msg.err{background:var(--err-bg);border:1px solid #fca5a5;color:#991b1b}
  .msg.info{background:#f8fafc;border:1px solid var(--line);color:var(--muted)}
  .status{font-size:1.1rem;font-weight:700;color:#065f46;margin:0 0 .5rem}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .searching{color:var(--muted);font-size:.9rem;margin:.5rem 0 0}
  .search-row{display:flex;gap:.5rem}
  .search-row input{flex:1;min-width:0}
  .search-row .primary{width:auto;flex:none}
  hr{border:0;border-top:1px solid var(--line);margin:1.25rem 0}
  @media (prefers-reduced-motion:no-preference){.card{transition:opacity .15s ease}}
  @media print{
    body{background:#fff}
    .noprint{display:none !important}
    .wrap{max-width:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="brand-in">
      <div class="logo-chip">
        <img src="assets/upbi-logo.png" width="62" height="34"
             alt="UPBI — Urban Poverty and Business Initiative">
      </div>
      <header>
        <h1>Collaboration Hub Sign-In</h1>
        <p class="sub">Recording your visit to the Collaboration Hub.</p>
      </header>
    </div>
  </div>

  <!-- ============================ FORM ============================ -->
  <main id="formScreen">
    <div id="formError" class="msg err" role="alert" hidden></div>

    <form id="signInForm" novalidate>

      <section class="card">
        <div class="field">

          <div class="search-row">
            <input id="nameQuery" name="nameQuery" type="text" autocomplete="off"
                   spellcheck="false" enterkeyhint="search"
                   aria-describedby="searchStatus" aria-controls="results">
            <button type="button" class="primary" id="searchBtn" disabled>Search</button>
          </div>
          <p id="searchStatus" class="searching" role="status" aria-live="polite"></p>
          <ul id="results" class="results" hidden></ul>
        </div>

        <div class="field" id="chosenWrap" hidden>
          <span class="hint" style="font-weight:600;color:var(--ink)">Signing in</span>
          <div class="chosen">
            <div style="flex:1">
              <strong id="chosenName"></strong>
              <span class="biz" id="chosenBiz"></span>
            </div>
            <button type="button" id="changeChoice">Change</button>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="field">
          <label for="visitType">Visit type</label>
          <select id="visitType" name="visitType">
            <option value="">Please select</option>
            <option value="walk_in">Walk-in</option>
            <option value="appointment">Appointment</option>
          </select>
        </div>

        <div class="field">
          <label for="consultantSelect">Student consultant
            <span class="hint">Who you are working with today.</span>
          </label>
          <select id="consultantSelect" name="consultant">
<option value="" disabled selected>Please Select</option>
            <option>Akul Ghambhani</option>
            <option>Alex Yu</option>
            <option>Andrea Diaz Matuty</option>
            <option>Anne Scheidt</option>
            <option>Annie Shedlock</option>
            <option>Antonio Dominguez De Obaldia</option>
            <option>Beth Martinez</option>
            <option>Brody Chapman</option>
            <option>Caroline Mezzalingua</option>
            <option>Carmen Castaneda</option>
            <option>Charity Ihrman</option>
            <option>Chloe Dsouza</option>
            <option>Connor Pietsch</option>
            <option>Connor Rezner</option>
            <option>Connor Smith</option>
            <option>Darren Tanuwijaya</option>
            <option>Egan McInerney</option>
            <option>Gabriella Simeone</option>
            <option>Gabrielle Salles</option>
            <option>Greta Prieto</option>
            <option>Isabela Egidio</option>
            <option>Irene Wang</option>
            <option>Jack Regan</option>
            <option>Josh Braganza</option>
            <option>Karoline Klebba</option>
            <option>Lilly Vonderwell</option>
            <option>Lukas Jesso</option>
            <option>Maddie Evangelista</option>
            <option>Mariana Hernandez</option>
            <option>Mario Suarez</option>
            <option>Martha Velasco</option>
            <option>Nnanna John</option>  
            <option>Noah Lancz</option>
            <option>Pete Kim</option>
            <option>Quinn Littlefield</option>
            <option>Rina Hassen</option>
            <option>Rowan Miller</option>
            <option>Sammy Krahl</option>
            <option>Sarah Harper</option>
            <option>Sofia Moreno</option>
            <option>Sophie Ramos</option>
            <option>Sydney Park</option>
            <option>Ted Cahill</option>
            <option>Vincent Mampieri</option>
            <option>Other</option>
          </select>
        </div>

        <div class="field">
          <label for="helpArea">Main area you need help with</label>
          <select id="helpArea" name="helpArea">
            <option value="">Please Select</option>
            <option>Accounting</option>
            <option>Artificial Intelligence (AI)</option>
            <option>Business Plan</option>
            <option>Business cards</option>
            <option>Canva</option>
            <option>Distribution</option>
            <option>Excel</option>
            <option>Finances</option>
            <option>Flyers - visibility</option>
            <option>Marketing</option>
            <option>Operations</option>
            <option>Photography (Headshots/products)</option>
            <option>Pricing</option>
            <option>Printing</option>
            <option>Research</option>
            <option>Sales</option>
            <option>Social Media</option>
            <option>Website</option>
            <option>Other</option>
          </select>
        </div>

        <div class="field">
          <label for="otherProblems">Anything else we should know?
            <span class="hint">Optional.</span>
          </label>
          <textarea id="otherProblems" name="otherProblems" maxlength="1000"></textarea>
        </div>
      </section>

      <button type="submit" class="primary" id="submitBtn">Sign in</button>
    </form>
  </main>

  <!-- ========================== SUCCESS =========================== -->
  <main id="successScreen" hidden>
    <div class="card">
      <p class="status" id="successHeadline"></p>
      <p class="sub" id="successDetail"></p>
      <div id="slipContent" style="margin-top:1rem">
        <hr>
        <p style="margin:.25rem 0"><strong id="slipName"></strong></p>
        <p style="margin:.25rem 0" id="slipMeta"></p>
        <p style="margin:.25rem 0;color:var(--muted)" id="slipTimestamp"></p>
      </div>
    </div>
    <div class="card noprint">
      <div class="field"><button type="button" class="secondary" id="printSlip">Print this slip</button></div>
      <div class="field"><button type="button" class="primary" id="againBtn">Sign in another entrepreneur</button></div>
    </div>
  </main>
</div>

<script>
(function(){
  "use strict";

  // Server-side endpoint. There is no database key on this page: the function
  // holds the credentials and decides everything that matters.
  var API = "https://srmtohwucijjniwajkhp.supabase.co/functions/v1/hub-signin";

  var $ = function(id){ return document.getElementById(id); };
  var chosen = null;          // {participant_id, display_name, business_name}
  var typedName = "";         // preserved verbatim -- matters for joint records
  var submitting = false;
  var submissionId = null;    // idempotency key, minted once per attempt
  var searchSeq = 0;          // guards against out-of-order search responses

  function showError(msg){
    var box = $("formError");
    // Unhide BEFORE writing the text. A hidden role="alert" is not in the
    // accessibility tree, so text set while hidden produces no mutation for a
    // screen reader to announce, and revealing it afterwards is routinely
    // missed. Revealing first, then writing on the next frame, means the
    // mutation happens inside a live region that is already present. On a form
    // where the failure message is "your visit was not recorded", silence here
    // is the whole bug.
    box.textContent = "";
    box.hidden = false;
    requestAnimationFrame(function(){
      box.textContent = msg;
      box.scrollIntoView({block:"nearest"});
    });
  }
  function clearError(){ $("formError").hidden = true; $("formError").textContent = ""; }

  function uuid(){
    if (crypto && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){
      var r = crypto.getRandomValues(new Uint8Array(1))[0] % 16;
      var v = c === "x" ? r : ((r & 0x3) | 0x8);
      return v.toString(16);
    });
  }

  // ---------------------------------------------------------------- search
  function renderResults(rows){
    var ul = $("results");
    ul.innerHTML = "";
    if (!rows || rows.length === 0){ ul.hidden = true; return; }
    rows.forEach(function(r){
      var li = document.createElement("li");
      var b  = document.createElement("button");
      b.type = "button";
      b.appendChild(document.createTextNode(r.display_name || ""));
      if (r.business_name){
        var s = document.createElement("span");
        s.className = "biz";
        s.textContent = r.business_name;
        b.appendChild(s);
      }
      b.addEventListener("click", function(){ choose(r); });
      li.appendChild(b);
      ul.appendChild(li);
    });
    ul.hidden = false;
  }

  function choose(r){
    chosen = r;
    $("chosenName").textContent = r.display_name || "";
    $("chosenBiz").textContent  = r.business_name || "";
    $("chosenWrap").hidden = false;
    $("results").hidden = true;
    $("searchStatus").textContent = "";
    clearError();
    $("visitType").focus();
  }

  $("changeChoice").addEventListener("click", function(){
    chosen = null;
    $("chosenWrap").hidden = true;
    $("nameQuery").focus();
    $("nameQuery").select();
  });

  // One explicit Search (button or Enter) = one request. Typing never searches:
  // this is a shared kiosk behind one IP, and searching per keystroke exhausted
  // the server's per-IP limit on 2026-09-28.
  var lastKey = null, lastRows = null;  // most recent successful search
  var inFlight = false;
  function cleanQuery(v){ return (v || "").trim().replace(/\s+/g, " "); }

  function updateSearchBtn(){
    $("searchBtn").disabled = inFlight || cleanQuery($("nameQuery").value).length < 3;
  }

  function showRows(rows){
    $("searchStatus").textContent = rows.length ? "" : "No match found. Check the spelling, or ask a consultant for help.";
    renderResults(rows);
  }

  $("nameQuery").addEventListener("input", function(e){
    typedName = e.target.value;
    chosen = null;
    $("chosenWrap").hidden = true;
    $("results").hidden = true;
    var n = cleanQuery(typedName).length;
    $("searchStatus").textContent = n === 0 ? "" : n < 3 ? "Type at least 3 letters, then tap Search." : "";
    updateSearchBtn();
  });

  $("nameQuery").addEventListener("keydown", function(e){
    if (e.key !== "Enter" || e.isComposing) return;
    e.preventDefault();                         // Enter here searches; it never submits the form
    doSearch();
  });

  $("searchBtn").addEventListener("click", doSearch);

  function doSearch(){
    if (inFlight) return;
    var q = cleanQuery($("nameQuery").value);
    if (q.length < 3){
      $("searchStatus").textContent = "Type at least 3 letters, then tap Search.";
      return;
    }
    clearError();
    var key = q.toLowerCase();
    if (key === lastKey){ showRows(lastRows); return; }  // same query: no second request
    runSearch(q, key);
  }

  function runSearch(q, key){
    var seq = ++searchSeq;
    inFlight = true;
    updateSearchBtn();
    $("searchStatus").textContent = "Searching…";
    fetch(API, {
      method:"POST",
      headers:{"content-type":"application/json"},
      body: JSON.stringify({action:"search", query:q})
    }).then(function(res){
      if (res.status === 429) throw new Error("Too many searches from this Hub device just now. Please wait a few minutes and try again.");
      if (!res.ok) throw new Error("We could not search right now. Please try again.");
      return res.json();
    }).then(function(data){
      if (seq !== searchSeq) return;            // the form was reset meanwhile
      var rows = ((data && data.results) || []).slice(0, 8);
      lastKey = key; lastRows = rows;
      if (cleanQuery($("nameQuery").value).toLowerCase() !== key){
        $("searchStatus").textContent = "";     // the name changed while searching
        return;
      }
      showRows(rows);
    }).catch(function(err){
      if (seq !== searchSeq) return;
      $("searchStatus").textContent = "";
      renderResults([]);
      showError(err.message);
    }).then(function(){
      if (seq !== searchSeq) return;
      inFlight = false;
      updateSearchBtn();
    });
  }

  // ---------------------------------------------------------------- submit
  $("signInForm").addEventListener("submit", function(e){
    e.preventDefault();
    if (submitting) return;                     // hard guard against double taps
    clearError();

    if (!chosen){ showError("Please choose who is signing in from the list."); $("nameQuery").focus(); return; }
    var visitType = $("visitType").value;
    if (!visitType){ showError("Please choose a visit type."); $("visitType").focus(); return; }

    submitting = true;
    var btn = $("submitBtn");
    btn.disabled = true;
    btn.textContent = "Signing in…";
    if (!submissionId) submissionId = uuid();   // same key survives a retry

    fetch(API, {
      method:"POST",
      headers:{"content-type":"application/json"},
      body: JSON.stringify({
        action:"submit",
        participant_id: chosen.participant_id,
        visit_type: visitType,
        visitor_name: typedName.trim(),         // joint records keep the real person
        consultant_name: $("consultantSelect").value || null,
        help_area: $("helpArea").value || null,
        notes: $("otherProblems").value || null,
        submission_id: submissionId
      })
    }).then(function(res){
      return res.json().catch(function(){ return null; }).then(function(body){
        if (!res.ok){
          var m = "We could not record your visit. Please try again.";
          if (res.status === 429) m = "Too many sign-ins from this connection. Please wait a moment and try again.";
          else if (body && body.error === "participant_not_eligible") m = "That entrepreneur is not currently active for South Bend. Please ask a consultant for help.";
          throw new Error(m);
        }
        return body;
      });
    }).then(function(body){
      // Success is shown ONLY here -- after the server confirmed the write.
      succeed(body);
    }).catch(function(err){
      // The submission is unresolved, so nothing is cleared and the same
      // idempotency key is reused: retrying cannot create a second visit.
      submitting = false;
      btn.disabled = false;
      btn.textContent = "Try again";
      showError(err.message);
    });
  });

  function succeed(body){
    var first = body && body.visitor_status === "first_visit";
    var already = body && (body.status === "already_recorded" || body.status === "already_signed_in_today");

    $("successHeadline").textContent = first
      ? "You're signed in — first recorded Hub visit"
      : "You're signed in — welcome back";
    $("successDetail").textContent = already
      ? "This visit was already recorded today, so we have not added a duplicate."
      : "Your physical Hub visit has been recorded.";

    $("slipName").textContent = (chosen && chosen.display_name) || typedName;
    var bits = [];
    if ($("visitType").value) bits.push($("visitType").value === "walk_in" ? "Walk-in" : "Appointment");
    if ($("consultantSelect").value) bits.push("Consultant: " + $("consultantSelect").value);
    if ($("helpArea").value) bits.push("Help area: " + $("helpArea").value);
    $("slipMeta").textContent = bits.join(" · ");
    $("slipTimestamp").textContent = "Visit date: " + ((body && body.visit_date_local) || "");

    $("formScreen").hidden = true;
    $("successScreen").hidden = false;
    $("successHeadline").setAttribute("tabindex","-1");
    $("successHeadline").focus();
    // Replace history so Back does not return to a filled-in form showing the
    // previous visitor's details.
    try { history.replaceState({signedIn:true}, "", location.pathname + location.search); } catch(_){}
  }

  $("printSlip").addEventListener("click", function(){ window.print(); });

  $("againBtn").addEventListener("click", function(){ resetForNextVisitor(); });

  function resetForNextVisitor(){
    chosen = null; typedName = ""; submitting = false; submissionId = null; searchSeq++;
    lastKey = null; lastRows = null; inFlight = false;
    $("signInForm").reset();
    $("nameQuery").value = "";
    $("results").innerHTML = ""; $("results").hidden = true;
    $("searchStatus").textContent = "";
    $("chosenWrap").hidden = true;
    $("chosenName").textContent = ""; $("chosenBiz").textContent = "";
    $("slipName").textContent = ""; $("slipMeta").textContent = ""; $("slipTimestamp").textContent = "";
    $("successHeadline").textContent = ""; $("successDetail").textContent = "";
    clearError();
    var btn = $("submitBtn"); btn.disabled = false; btn.textContent = "Sign in";
    $("successScreen").hidden = true;
    $("formScreen").hidden = false;
    updateSearchBtn();
    $("nameQuery").focus();
  }

  // If the page is restored from the back/forward cache after a completed
  // sign-in, do not leave the previous visitor's answers on screen.
  window.addEventListener("pageshow", function(ev){
    if (ev.persisted && $("successScreen").hidden === false) resetForNextVisitor();
  });
})();
</script>
</body>
</html>
